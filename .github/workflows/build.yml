name: Build launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-launcher.txt pyinstaller
      - name: Run launcher tests
        run: python -m unittest test_launcher test_emulator_download
      - name: Download and verify the public Windows emulator
        if: runner.os == 'Windows'
        run: python -c "import tempfile; from pathlib import Path; import emulator_download, launcher; print(emulator_download.download_emulator(Path(tempfile.mkdtemp()), launcher.check_emulator))"
      - name: Build and smoke test launcher
        run: python build_launcher.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
